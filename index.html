<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학기말 영화 상영 예매</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--ok:#047857;--bad:#b91c1c;--ph:#2a2d34;--w:clamp(168px,56vw,230px);--gap:16px}
@media (prefers-color-scheme:dark){:root{--bg:#101114;--ink:#e7e8ea;--mut:#9aa0a8;--line:#272a30;--ok:#34d399;--bad:#f87171;--ph:#1b1d22}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:32px max(24px,env(safe-area-inset-right)) 80px max(24px,env(safe-area-inset-left))}
button,input{touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mut{color:var(--mut)}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
h1{font-size:1.25rem;font-weight:700;margin:0;letter-spacing:-.01em}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem}
.txt{min-height:44px;padding:0 4px;border:0;background:none;color:var(--mut);font:inherit;font-size:.88rem;cursor:pointer}
.txt:hover{color:var(--ink)}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:16px;border-bottom:1px solid var(--line)}
.cur{padding:10px 2px;margin-bottom:-1px;border-bottom:2px solid var(--ink);font-size:.95rem;font-weight:700}
.lead{margin:20px 0 0;font-size:.9rem}

/* 로그인 */
.login{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:20px}
.login input{width:140px;padding:9px 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--ink);font:inherit}
.login .pill{margin:0}
.login input:focus{outline:none;border-bottom-color:var(--ink)}
.msg{min-height:1.6em;margin:20px 0 8px;text-align:center;color:var(--mut);font-size:.88rem}

/* 버튼 */
.pill{min-height:44px;margin-top:14px;padding:0 28px;border:1px solid var(--ink);border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:.9rem;font-weight:500;cursor:pointer}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill:disabled{border-color:var(--line);color:var(--mut);cursor:not-allowed}
.pill.wait:disabled{cursor:wait}
@media (hover:hover){
  .pill:hover:not(:disabled){background:var(--ink);color:var(--bg)}
  .pill.bad:hover:not(:disabled){background:var(--bad);color:var(--bg)}
}

/* 캐러셀 */
.stage{position:relative}
.track{position:relative;display:flex;align-items:flex-start;gap:var(--gap);margin:0;padding:0 0 4px;list-style:none;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track::before,.track::after{content:"";flex:0 0 calc(50% - var(--w) / 2 - var(--gap))}
.slide{flex:0 0 var(--w);scroll-snap-align:center;text-align:center}
.poster{position:relative;display:block;width:100%;min-height:0;aspect-ratio:2/3;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--ph);cursor:pointer;opacity:.5;transform:scale(.84);transform-origin:50% 100%;transition:transform .25s,opacity .25s}
.poster::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.on .poster{opacity:1;transform:none;cursor:default}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.ph{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;color:#e7e8ea;font-weight:700;font-size:1.1rem;text-align:center;word-break:keep-all}
.no{position:absolute;left:14px;bottom:8px;z-index:1;color:#fff;font-size:3.5rem;font-weight:700;font-style:italic;line-height:1}
.tag{position:absolute;top:10px;left:10px;z-index:1;padding:2px 8px;border-radius:3px;background:var(--ink);color:var(--bg);font-size:.72rem;font-weight:500;line-height:1.6}
.tag.ok{background:var(--ok);color:var(--bg)}
.t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin:14px 0 0;color:var(--mut);font-size:1.05rem;font-weight:700;line-height:1.4;word-break:keep-all;transition:color .25s}
.on .t{color:var(--ink)}
.more{visibility:hidden;margin-top:6px;font-size:.88rem}
.on .more{visibility:visible}
.more p,.info p{margin:2px 0}
.seat{color:var(--mut)}
.seat.low{color:var(--bad)}
.ok{color:var(--ok);font-weight:500}
.desc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:8px!important;color:var(--mut)}
.v{display:inline-block;width:1px;height:.8em;margin:0 8px;background:var(--mut);opacity:.5;vertical-align:-1px}
.arrow{position:absolute;z-index:2;top:calc(var(--w) * .75);transform:translateY(-50%);display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--mut);border-radius:50%;background:var(--bg);color:var(--ink);cursor:pointer}
#prev{left:0}
#next{right:0}
.arrow:disabled{opacity:.3;cursor:default}
@media (hover:none){.arrow{display:none}}
.count{margin:20px 0 0;text-align:center;font-size:.8rem}
.empty{padding:48px 0;text-align:center}

/* 리스트형 */
.rows{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.th{flex:none;width:56px;aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:var(--ph)}
.th .ph{padding:4px;font-size:.7rem}
.row .info{flex:1;min-width:0;font-size:.88rem}
.row h2{margin:0;font-size:1rem;font-weight:700}
.row .pill{flex:none;margin:0}

@media (max-width:520px){
  main{padding-top:20px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .login input{flex:1 1 40%;width:auto}
  .row{flex-wrap:wrap}
  .row .info{flex:1 1 0}
  .row .pill{width:100%}
}
@media (prefers-reduced-motion:reduce){.poster,.t{transition:none}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>학기말 영화 상영</h1>
    <div class="who" id="userBar" hidden>
      <strong id="who"></strong>
      <button class="txt" id="logoutBtn" type="button">로그아웃</button>
    </div>
  </header>

  <nav class="sub">
    <span class="cur" aria-current="page">상영작</span>
    <button class="txt" id="viewBtn" type="button">리스트형</button>
  </nav>

  <p class="lead mut">보고 싶은 영화를 한 편 선택해 예매하세요. 예매 후에도 다른 영화로 바꿀 수 있습니다.</p>

  <form class="login" id="loginForm">
    <input id="sid" placeholder="학번" inputmode="numeric" autocomplete="username" aria-label="학번" required>
    <input id="code" placeholder="개인 코드" autocomplete="current-password" aria-label="개인 코드" required>
    <button class="pill">로그인</button>
  </form>

  <p class="msg" id="msg" role="status"></p>
  <div id="view"></div>
</main>

<script>
const API = "https://songyang-cgv.pcofjeongchan.workers.dev"; // 배포한 Worker 주소
const TEST_MODE = true; // 로그인 없이 테스트 (운영 때는 false)
const newId = () => "test-" + Math.random().toString(36).slice(2, 7);
let testUser = localStorage.getItem("testUser") || newId();
localStorage.setItem("testUser", testUser);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token = TEST_MODE ? "test" : localStorage.getItem("token");
let items = [], mine = null, cur = 0, first = true, sig = "";
let view = localStorage.getItem("view") === "list" ? "list" : "card";
const smooth = () => (matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth");
const CHEV = (d) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

// 서버 통신
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}), ...(TEST_MODE ? { "X-Test-User": testUser } : {}) } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token && path !== "/api/login") logout("로그인이 만료되었습니다. 다시 로그인해 주세요.");
  if (!r.ok) throw new Error(d.error || "오류가 발생했습니다.");
  return d;
}
const say = (t) => ($("#msg").textContent = t);

// 로그인 상태
function showUser() {
  $("#loginForm").hidden = !!token;
  $("#userBar").hidden = !token;
  $("#who").textContent = TEST_MODE ? "테스트 학생 " + testUser : (localStorage.getItem("name") || "") + " 학생";
  $("#logoutBtn").textContent = TEST_MODE ? "다른 테스트 학생으로 전환" : "로그아웃";
  if (TEST_MODE) say("테스트 모드입니다. 로그인 없이 예매를 시험할 수 있습니다.");
  else if (!token) say("로그인하면 예매할 수 있습니다.");
}
function logout(m = "") { ["token", "name", "admin"].forEach((k) => localStorage.removeItem(k)); token = null; showUser(); load(); if (m) say(m); }

// 공통 조각
const poster = (s) => s.poster_url
  ? `<img src="${esc(s.poster_url)}" alt="${esc(s.title)}" loading="lazy" draggable="false" onerror="phFix(this)">`
  : `<span class="ph">${esc(s.title)}</span>`;
function phFix(img) { const p = document.createElement("span"); p.className = "ph"; p.textContent = img.alt; img.replaceWith(p); }
function meta(s) {
  const m = mine === s.id, left = Math.max(s.remaining, 0);
  const loc = [s.room, s.start_at].filter(Boolean).map(esc).join(`<i class="v"></i>`);
  return `${loc ? `<p>${loc}</p>` : ""}<p class="seat${left <= 5 ? " low" : ""}">${m ? `<span class="ok">예매 완료</span><i class="v"></i>` : ""}남은 자리 ${left}/${s.capacity}</p>`;
}
function btn(s) {
  const m = mine === s.id, full = s.remaining <= 0 && !m;
  if (!token) return `<button class="pill" disabled>로그인 필요</button>`;
  if (m) return `<button class="pill bad" onclick="cancelRes(this)">예매 취소</button>`;
  return `<button class="pill" ${full ? "disabled" : ""} onclick="reserve(${s.id}, this)">${full ? "매진" : mine !== null ? "이 영화로 변경" : "예매하기"}</button>`;
}
const desc = (s) => (s.description ? `<p class="desc">${esc(s.description)}</p>` : "");

// 카드형 (가운데 포커스)
function slide(s, i) {
  const m = mine === s.id, full = s.remaining <= 0 && !m;
  return `<li class="slide" data-i="${i}">
    <button class="poster" type="button" onclick="go(${i})" aria-label="${esc(s.title)} 선택">
      ${poster(s)}${m ? `<span class="tag ok">예매 완료</span>` : full ? `<span class="tag">매진</span>` : ""}<b class="no">${i + 1}</b>
    </button>
    <h2 class="t">${esc(s.title)}</h2>
    <div class="more">${meta(s)}${desc(s)}${btn(s)}</div></li>`;
}
// 리스트형
function row(s) {
  return `<li class="row"><div class="th">${poster(s)}</div>
    <div class="info"><h2>${esc(s.title)}</h2>${meta(s)}${desc(s)}</div>${btn(s)}</li>`;
}

function render() {
  $("#viewBtn").textContent = view === "list" ? "카드형" : "리스트형";
  const box = $("#view");
  if (!items.length) { box.innerHTML = `<p class="empty mut">아직 등록된 영화가 없습니다. 곧 공개됩니다.</p>`; return; }
  if (view === "list") { box.innerHTML = `<ul class="rows">${items.map(row).join("")}</ul>`; return; }
  box.innerHTML = `<div class="stage" role="region" aria-roledescription="carousel" aria-label="상영 영화">
      <button class="arrow" id="prev" type="button" aria-label="이전 영화" onclick="go(cur - 1)">${CHEV("M15 5l-7 7 7 7")}</button>
      <ul class="track" id="track" tabindex="0">${items.map(slide).join("")}</ul>
      <button class="arrow" id="next" type="button" aria-label="다음 영화" onclick="go(cur + 1)">${CHEV("M9 5l7 7-7 7")}</button>
    </div><p class="count mut" id="count"></p>`;
  cur = Math.min(cur, items.length - 1);
  const t = $("#track");
  t.scrollLeft = left(cur);
  t.addEventListener("scroll", onScroll, { passive: true });
  t.onkeydown = (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
  };
  mark();
}

// 캐러셀 위치
function left(i) { const t = $("#track"), el = t.children[i]; return el.offsetLeft + el.offsetWidth / 2 - t.clientWidth / 2; }
function go(i) {
  const t = $("#track"); if (!t) return;
  t.scrollTo({ left: left(Math.max(0, Math.min(i, items.length - 1))), behavior: smooth() });
}
let tick = false;
function onScroll() { if (tick) return; tick = true; requestAnimationFrame(() => { tick = false; mark(); }); }
function mark() {
  const t = $("#track"); if (!t) return;
  const mid = t.scrollLeft + t.clientWidth / 2;
  let best = 0, d = Infinity;
  [...t.children].forEach((el, i) => { const x = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid); if (x < d) { d = x; best = i; } });
  cur = best;
  [...t.children].forEach((el, i) => el.classList.toggle("on", i === best));
  $("#prev").disabled = best === 0;
  $("#next").disabled = best === items.length - 1;
  $("#count").textContent = (best + 1) + " / " + items.length;
}

// 데이터 갱신 (바뀐 게 없으면 다시 그리지 않음)
function draw() {
  const s = JSON.stringify([items, mine, view, !!token]);
  if (s !== sig) { sig = s; render(); }
}
async function load() {
  if (busy) return; // 처리 중에는 자동 갱신 건너뜀
  try {
    const d = await api("/api/screenings");
    items = d.screenings; mine = d.mine;
    if (first) { first = false; cur = Math.max(items.findIndex((s) => s.id === mine), 0); } // 처음엔 내 예매 영화를 가운데로
    draw();
  } catch (e) { say(e.message); }
}
// 처리 중 버튼 잠금 (중복 클릭 방지)
let busy = false;
async function act(btn, label, fn) {
  if (busy) return;
  busy = true;
  const old = btn.textContent;
  document.querySelectorAll(".pill").forEach((b) => (b.disabled = true));
  btn.textContent = label; btn.classList.add("wait");
  try { await fn(); } catch (e) { say(e.message); }
  busy = false; sig = "";
  await load();
  draw(); // 통신 실패로 목록이 안 그려진 경우 대비
  btn.textContent = old; btn.classList.remove("wait"); btn.disabled = false;
}
const reserve = (id, btn) => act(btn, "예매 중...", async () => {
  await api("/api/reserve", { method: "POST", body: JSON.stringify({ screeningId: id }) });
  say("예매가 완료되었습니다.");
});
const cancelRes = (btn) => act(btn, "취소 중...", async () => {
  await api("/api/reserve", { method: "DELETE" });
  say("예매를 취소했습니다.");
});

// 이벤트
$("#viewBtn").onclick = () => { view = view === "list" ? "card" : "list"; localStorage.setItem("view", view); draw(); };
$("#loginForm").onsubmit = (e) => {
  e.preventDefault();
  act($("#loginForm button"), "로그인 중...", async () => {
    const d = await api("/api/login", { method: "POST", body: JSON.stringify({ studentId: $("#sid").value, code: $("#code").value }) });
    token = d.token; localStorage.setItem("token", token); localStorage.setItem("name", d.name);
    showUser(); say("");
  });
};
$("#logoutBtn").onclick = () => {
  if (!TEST_MODE) return logout();
  testUser = newId(); localStorage.setItem("testUser", testUser); showUser(); load(); // 새 학생인 척 전환
};
showUser(); load();
setInterval(() => { if (!document.hidden) load(); }, 30000); // 화면이 보일 때만 30초마다 갱신 (DB 읽기 절약)
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
